name: Build Desktop (Windows + macOS + Linux)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release onde publicar os artefatos"
        required: true
        default: "v1.0.0"
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

env:
  ELECTRON_VERSION: "33.4.11"
  FFMPEG_TAG: "b6.1.1"

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: AppleSilicon
          - arch: x64
            label: Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Baixar binarios nativos de macOS
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p bin

          echo "::group::yt-dlp (universal)"
          curl -sSL -o bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          echo "::endgroup::"

          echo "::group::ffmpeg + ffprobe (estaticos, ${{ matrix.arch }})"
          curl -sSL -o bin/ffmpeg \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffmpeg-darwin-${{ matrix.arch }}"
          curl -sSL -o bin/ffprobe \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffprobe-darwin-${{ matrix.arch }}"
          echo "::endgroup::"

          chmod +x bin/yt-dlp bin/ffmpeg bin/ffprobe

          # Falha cedo se algum download vier vazio ou como pagina de erro
          for b in yt-dlp ffmpeg ffprobe; do
            size=$(stat -f%z "bin/$b")
            echo "$b: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "ERRO: bin/$b tem apenas $size bytes - download falhou"
              exit 1
            fi
          done

          # ffmpeg/ffprobe rodam na arquitetura do runner? Só valida a nativa.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./bin/ffmpeg -version | head -1
            ./bin/ffprobe -version | head -1
          fi

      - name: Gerar icone .icns a partir do PNG oficial
        working-directory: app
        run: |
          set -euo pipefail
          SRC=icon-source.png

          # Guarda: falha alto se a fonte nao for um PNG de verdade.
          # O antigo logo.png era um WebM renomeado e quebrava o sips com erro 13.
          if [ "$(file -b --mime-type "$SRC")" != "image/png" ]; then
            echo "ERRO: $SRC nao e PNG, e $(file -b "$SRC")"
            exit 1
          fi

          ICONSET=icon.iconset
          mkdir -p "$ICONSET"
          # Apenas os tamanhos que o iconutil aceita: 16, 32, 128, 256, 512
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done

          iconutil -c icns "$ICONSET" -o icon.icns
          rm -rf "$ICONSET"
          ls -la icon.icns

      - name: Empacotar .app
        run: |
          set -euo pipefail
          npx --yes @electron/packager@20 app "Media Downloader" \
            --platform=darwin \
            --arch=${{ matrix.arch }} \
            --electron-version="$ELECTRON_VERSION" \
            --app-bundle-id=com.alexascencio.mediadownloader.desktop \
            --app-version=1.0.0 \
            --icon=app/icon.icns \
            --no-asar \
            --overwrite \
            --out=out
          ls -la "out/Media Downloader-darwin-${{ matrix.arch }}"

      - name: Conferir layout do bundle
        run: |
          set -euo pipefail
          APP="out/Media Downloader-darwin-${{ matrix.arch }}/Media Downloader.app"
          echo "::group::Contents"
          ls -la "$APP/Contents"
          echo "::endgroup::"
          echo "::group::Resources"
          ls -la "$APP/Contents/Resources" | head -30
          echo "::endgroup::"
          du -sh "$APP"

          RES="$APP/Contents/Resources"
          if [ -f "$RES/app.asar" ]; then
            echo "ERRO: app foi empacotado em asar; binarios em bin/ nao seriam executaveis"
            exit 1
          fi
          for b in yt-dlp ffmpeg ffprobe; do
            test -x "$RES/app/bin/$b" || { echo "ERRO: $b ausente ou sem permissao de execucao"; exit 1; }
          done
          echo "OK: bin/ presente e executavel dentro do bundle"

      - name: Assinatura ad-hoc
        run: |
          set -euo pipefail
          APP="out/Media Downloader-darwin-${{ matrix.arch }}/Media Downloader.app"

          # Assina de dentro para fora: binarios embutidos primeiro
          for f in "$APP/Contents/Resources/app/bin/"*; do
            codesign --force --sign - "$f"
          done

          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Gerar .dmg e .zip
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          LABEL="${{ matrix.label }}"
          APPDIR="out/Media Downloader-darwin-$ARCH"
          APP="$APPDIR/Media Downloader.app"
          mkdir -p dist

          # ZIP preservando metadados e assinatura do bundle
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "dist/MediaDownloader-macOS-$LABEL.zip"

          # DMG com atalho para /Applications
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Media Downloader" \
            -srcfolder "$STAGE" -ov -format ULFO \
            "dist/MediaDownloader-macOS-$LABEL.dmg"
          rm -rf "$STAGE"

          ls -lh dist/

      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Publicado em $TAG:"
          ls dist/

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Baixar binarios nativos de Windows
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p bin

          curl -sSL -o bin/yt-dlp.exe             https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

          # Estaticos, mesma fonte usada no build de macOS: mantem as plataformas
          # em paridade e troca o build "full" de 212 MB por um de 79 MB que tem
          # todos os codecs usados pelo app (libx264, prores, aac, pcm_s24le, mp3).
          curl -sSL -o bin/ffmpeg.exe             "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffmpeg-win32-x64"
          curl -sSL -o bin/ffprobe.exe             "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffprobe-win32-x64"

          curl -sSL -o aria2.zip             https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
          7z e -y aria2.zip -obin "*/aria2c.exe" >/dev/null
          rm -f aria2.zip

          for b in yt-dlp.exe ffmpeg.exe ffprobe.exe aria2c.exe; do
            size=$(stat -c%s "bin/$b")
            echo "$b: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "ERRO: bin/$b tem apenas $size bytes - download falhou"
              exit 1
            fi
          done

          # Confirma que os codecs que o app usa existem neste build
          for c in libx264 prores_ks aac pcm_s24le libmp3lame; do
            ./bin/ffmpeg.exe -hide_banner -encoders 2>/dev/null | grep -qw "$c"               || { echo "ERRO: codec $c ausente no ffmpeg"; exit 1; }
            echo "codec OK: $c"
          done

      - name: Empacotar .exe
        run: |
          set -euo pipefail
          npx --yes @electron/packager@20 app "Media Downloader"             --platform=win32             --arch=x64             --electron-version="$ELECTRON_VERSION"             --app-version=1.0.0             --icon=app/icons/icon.ico             --no-asar             --overwrite             --out=out
          ls -la "out/Media Downloader-win32-x64"

      - name: Enxugar o pacote
        run: |
          set -euo pipefail
          DIR="out/Media Downloader-win32-x64"

          echo "antes: $(du -sm "$DIR" | cut -f1) MB"

          # O build antigo copiava bin/ duas vezes, dobrando 431 MB a toa.
          # Aqui existe uma copia so, dentro de resources/app.
          RES="$DIR/resources/app"
          test -x "$RES/bin/ffmpeg.exe" || { echo "ERRO: bin/ ausente no pacote"; exit 1; }
          if [ -d "$DIR/bin" ]; then rm -rf "$DIR/bin"; echo "removida copia duplicada de bin/"; fi

          # 55 idiomas do Chromium, dos quais o app usa dois.
          find "$DIR/locales" -name "*.pak" ! -name "en-US.pak" ! -name "pt-BR.pak" -delete
          echo "idiomas mantidos: $(ls "$DIR/locales")"

          rm -f "$DIR/LICENSES.chromium.html"

          echo "depois: $(du -sm "$DIR" | cut -f1) MB"

      - name: Incluir o instalador
        run: |
          set -euo pipefail
          DIR="out/Media Downloader-win32-x64"
          cp installers/windows/Instalar.bat    "$DIR/"
          cp installers/windows/Desinstalar.bat "$DIR/"
          ls -la "$DIR"/*.bat

      - name: Gerar .zip
        run: |
          set -euo pipefail
          mkdir -p dist
          # Deflate e nao LZMA2 de proposito: o Explorer do Windows so abre
          # Deflate nativamente, e um zip que exige 7-Zip instalado trava o usuario.
          7z a -tzip -mx=9 "dist/MediaDownloader-Windows-x64.zip"             "./out/Media Downloader-win32-x64/*" >/dev/null
          ls -lh dist/

      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Publicado em $TAG"

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Baixar binarios nativos de Linux
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p bin

          curl -sSL -o bin/yt-dlp             https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -sSL -o bin/ffmpeg             "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffmpeg-linux-x64"
          curl -sSL -o bin/ffprobe             "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/ffprobe-linux-x64"

          # aria2 nao publica binario para Linux nas releases oficiais, so Android.
          # O downloader trata aria2 como opcional, entao o yt-dlp usa o motor nativo.

          chmod +x bin/yt-dlp bin/ffmpeg bin/ffprobe

          for b in yt-dlp ffmpeg ffprobe; do
            size=$(stat -c%s "bin/$b")
            echo "$b: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "ERRO: bin/$b tem apenas $size bytes - download falhou"
              exit 1
            fi
          done

          for c in libx264 prores_ks aac pcm_s24le libmp3lame; do
            ./bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -qw "$c"               || { echo "ERRO: codec $c ausente no ffmpeg"; exit 1; }
            echo "codec OK: $c"
          done

      - name: Empacotar aplicacao
        run: |
          set -euo pipefail
          npx --yes @electron/packager@20 app "Media Downloader"             --platform=linux             --arch=x64             --electron-version="$ELECTRON_VERSION"             --app-version=1.0.0             --executable-name=media-downloader             --no-asar             --overwrite             --out=out
          ls -la "out/Media Downloader-linux-x64"

      - name: Enxugar o pacote
        run: |
          set -euo pipefail
          DIR="out/Media Downloader-linux-x64"
          echo "antes: $(du -sm "$DIR" | cut -f1) MB"
          find "$DIR/locales" -name "*.pak" ! -name "en-US.pak" ! -name "pt-BR.pak" -delete
          echo "idiomas mantidos:"; ls "$DIR/locales"
          rm -f "$DIR/LICENSES.chromium.html"
          echo "depois: $(du -sm "$DIR" | cut -f1) MB"

      - name: Montar AppDir
        run: |
          set -euo pipefail
          DIR="out/Media Downloader-linux-x64"
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$DIR/." "$APPDIR/usr/bin/"

          # O Electron exige que chrome-sandbox seja setuid root, o que um AppImage
          # nao consegue garantir. Passar --no-sandbox e o padrao adotado por apps
          # Electron distribuidos em AppImage.
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/media-downloader" --no-sandbox "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/media-downloader.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Media Downloader
          Comment=Baixe videos, audios, playlists e canais com qualidade maxima
          Exec=media-downloader
          Icon=media-downloader
          Categories=AudioVideo;Video;
          Terminal=false
          DESKTOP

          cp app/icon-source.png "$APPDIR/media-downloader.png"
          ls -la "$APPDIR"

      - name: Gerar AppImage
        run: |
          set -euo pipefail
          curl -sSL -o appimagetool             https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p dist
          # Os runners atuais do Ubuntu nao trazem libfuse2, entao o appimagetool
          # roda em modo de extracao em vez de montar via FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir             dist/MediaDownloader-Linux-x86_64.AppImage
          chmod +x dist/MediaDownloader-Linux-x86_64.AppImage
          ls -lh dist/

      - name: Conferir o AppImage gerado
        run: |
          set -euo pipefail
          cd dist
          ./MediaDownloader-Linux-x86_64.AppImage --appimage-extract >/dev/null
          RES=squashfs-root/usr/bin/resources/app
          test -x "$RES/bin/ffmpeg"  || { echo "ERRO: ffmpeg ausente no AppImage";  exit 1; }
          test -x "$RES/bin/ffprobe" || { echo "ERRO: ffprobe ausente no AppImage"; exit 1; }
          test -x "$RES/bin/yt-dlp"  || { echo "ERRO: yt-dlp ausente no AppImage";  exit 1; }
          test -f "$RES/src/index.html" || { echo "ERRO: fonte do app ausente"; exit 1; }
          "$RES/bin/ffmpeg" -hide_banner -version | head -1
          echo "OK: AppImage contem os motores e o app"
          rm -rf squashfs-root

      - name: Publicar na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          cp installers/linux/instalar.sh    dist/
          cp installers/linux/desinstalar.sh dist/
          gh release upload "$TAG"             dist/MediaDownloader-Linux-x86_64.AppImage             dist/instalar.sh             dist/desinstalar.sh             --clobber --repo "$GITHUB_REPOSITORY"
          echo "Publicado em $TAG"
