name: Android - build and device validation
on:
  push:
    branches: [feat/after-effects-adapter]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare current yt-dlp and permanent release signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 -d > android/keystore.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
          mkdir -p android/app/src/main/res/raw
          curl -fL --retry 3 --max-time 120 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o android/app/src/main/res/raw/ytdlp
          test "$(stat -c%s android/app/src/main/res/raw/ytdlp)" -gt 1000000
          sha256sum android/app/src/main/res/raw/ytdlp
      - name: Build and unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease assembleDebugAndroidTest
      - name: Enable KVM for disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native media conversion tests and capture installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && gradle --no-daemon connectedDebugAndroidTest && cd ..
            mkdir -p dist/android-device
            adb exec-out run-as com.alexascencio.mediadownloader tar -cf - files/device-test > dist/android-device/results.tar
            adb uninstall com.alexascencio.mediadownloader
            adb install android/app/build/outputs/apk/release/app-universal-release.apk
            adb shell am start -n com.alexascencio.mediadownloader/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT https://youtu.be/Uw-_a0taISM
            sleep 35
            adb shell screencap -p /sdcard/media-downloader.png
            adb pull /sdcard/media-downloader.png dist/android-device/screenshot.png
            adb logcat -d > dist/android-device/logcat.txt
      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist/android-apk
          for f in android/app/build/outputs/apk/release/*.apk; do
            test -f "$f" || continue
            case "$f" in
              *arm64-v8a*) name=arm64;;
              *armeabi-v7a*) name=arm32;;
              *x86_64*) name=x86_64;;
              *universal*) name=universal;;
              *) continue;;
            esac
            cp "$f" "dist/android-apk/MediaDownloader-Android-$name.apk"
          done
          if compgen -G 'dist/android-apk/*.apk' >/dev/null; then cd dist/android-apk && sha256sum *.apk > SHA256SUMS.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-1.3.1-validation
          path: |
            dist/android-apk
            dist/android-device
            android/app/build/reports
          retention-days: 7
      - name: Publish validated Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v1.3.1 >/dev/null 2>&1 || gh release create android-v1.3.1 --target "$GITHUB_SHA" --title 'Android 1.3.1' --notes 'Motor atualizado com QuickJS, miniatura e seletores compactos. Conversão MP4/MP3/WAV testada em emulador Android. Uma instalação antiga com outra assinatura pode exigir remover o APK antigo antes de instalar; mídias já salvas nas pastas públicas são independentes do aplicativo. Plataformas podem exigir autenticação ou bloquear a rede. O download do vídeo específico no aparelho físico ainda precisa de confirmação.'
          gh release upload android-v1.3.1 dist/android-apk/* --clobber
